[project]
name = "100xai-backend"
version = "0.1.0"
description = "FastAPI backend for 100xAI onboarding and Brand DNA."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "uvicorn[standard]>=0.30.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

