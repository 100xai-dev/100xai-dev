services:
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        # Baked into the Next bundle at build time (the BFF proxy reads it
        # server-side). Runtime env alone is ignored because Next inlines it.
        BACKEND_URL: http://api:8000
    environment:
      # The Next BFF proxy (app/api/[...path]/route.ts) forwards server-side from
      # inside this container, so it must reach the backend over the internal
      # Docker network — NOT the public domain (which would hairpin through Caddy
      # and is unreachable from within the container).
      BACKEND_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      # Use node instead of `wget --spider`: the Next root often answers with a
      # 3xx redirect (e.g. to /login), which busybox wget treats as failure and
      # left the container "unhealthy". Treat any status < 400 as healthy.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    # Load all application credentials (API keys, SMTP, etc.) from backend/.env.
    # Read from the host at container start, so .dockerignore does not apply.
    env_file:
      - ./backend/.env
    # NOTE: environment values below OVERRIDE env_file. Only infra endpoints that
    # must point at Docker service names live here; everything else comes from
    # backend/.env so it is not silently shadowed.
    environment:
      DATABASE_URL: postgresql+psycopg://100xai:100xai@postgres:5432/100xai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-100xai-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-100xai-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-100xai-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WPCOM_REDIRECT_URI: ${WPCOM_REDIRECT_URI:-http://localhost:8000/v1/integrations/wordpress/oauth/callback}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    # Workers run the pipelines that need the LLM / SERP / scraping API keys.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://100xai:100xai@postgres:5432/100xai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # rq info exits non-zero if it cannot reach Redis or the worker has no
      # registered queues — meaningful liveness, unlike a bare `print`.
      # NOTE: `$$` (not `$`) so Compose does NOT interpolate the variable at parse
      # time. A single `$REDIS_URL` is substituted to an empty string by Compose
      # (it's only defined in the container env, not the host), which made the
      # check run `rq info -u ""` and the worker report unhealthy forever.
      test: ["CMD-SHELL", "rq info -u \"$$REDIS_URL\" --only-queues onboarding purge default blog keyword_research serp_analysis content_generation publisher >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: 100xai
      POSTGRES_PASSWORD: 100xai
      POSTGRES_DB: 100xai
    ports:
      # Bind to loopback only. api/worker reach Postgres over the internal Docker
      # network by service name, so the DB never needs a public port. Exposing
      # 0.0.0.0:5432 invites internet brute-force scans against the default
      # `postgres` superuser (see fatal auth-failure log spam).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 100xai -d 100xai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only — Redis here has NO password, so a public 0.0.0.0:6379 is a
      # remote-code-execution risk. api/worker reach it via the internal network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-100xai-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-100xai-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  default:
    driver: bridge
