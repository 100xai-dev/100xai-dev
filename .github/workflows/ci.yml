name: backend-ci

on:
  push:
  pull_request:

jobs:
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-change-me-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./backend[dev]"
      - run: alembic -c backend/alembic.ini upgrade head
      - run: PYTHONPATH=backend python -m pytest -p no:rerunfailures backend/tests -q
